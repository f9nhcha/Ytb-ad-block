mode: rule
mixed-port: 7897
allow-lan: true
log-level: silent
ipv6: false
external-controller: 0.0.0.0:9097
secret: set-your-secret
unified-delay: false
external-controller-cors:
  allow-origins:
  - https://yacd.metacubex.one
  - https://metacubex.github.io
  - https://board.zash.run.place
  - http://board.zash.run.place
  - tauri://localhost
  - http://tauri.localhost
  - http://localhost:3000
  allow-private-network: true
external-controller-pipe: \\.\pipe\verge-mihomo-sidecar-release-65a5083e18f89f4e8a64b31df04bd32f45c7677a267ff759eeaeec1b93e6f424
tun:
  auto-detect-interface: true
  auto-route: true
  device: Mihomo
  dns-hijack:
  - any:53
  mtu: 1500
  route-exclude-address: []
  stack: gvisor
  strict-route: false
  enable: false
profile:
  store-selected: true
dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost
  nameserver:
  - tls://dns.google
  fallback:
  - tls://1.1.1.1
  - tls://8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN
proxies: []
proxy-providers:
  proxy-test:
    type: http
    url: https://cdn.jsdelivr.net/gh/SnapdragonLee/SystemProxy@master/dist/clash_config_extra.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 1000
  proxy-test1:
    type: http
    url: https://cdn.jsdelivr.net/gh/f9nhcha/Ytb-ad-block@main/clash1.yaml
    interval: 900
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
- name: proxy test
  type: select
  use:
  - proxy-test
  - proxy-test1
- name: proxy ytb
  type: url-test
  use:
  - proxy-test
  - proxy-test1
  filter: "(?i)🇯🇵JP-149.22.87.240-0108|🇺🇸US_187_0@186|🇯🇵JP-149.22.87.241-0120|🇳🇱NL-109.201.152.181-0098|GB-146.70.61.37-0059|NL-193.29.139.147-0086|GB-82.38.31.202-0097|GB-82.38.31.194-0089|GB-82.38.31.10-0080|GB-82.38.31.210-0064|GB-82.38.31.149-0085|GB-82.38.31.155-0067|GB-82.38.31.16-0096|GB-82.38.31.176-0141|GB-82.38.31.179-0105|🇬🇧GB_12_0@11🇬🇧|🇧🇬BG_02_1@1|🇬🇧GB_09_0@8|🇬🇧GB_10_0@9|🇬🇧GB_11_0@10🇬🇧GB_12_0@11🇬🇧GB_13_0@12|🇬🇧GB_15_0@14|🇬🇧GB_17_0@16|🇬🇧GB_21_0@20"
  url: http://www.gstatic.com/generate_204
  interval: 450
- name: google tv
  type: select
  use:
  - proxy-test
  - proxy-test1
  #filter: "(?i)HK_89_1@88"
  proxies:
    - REJECT
  url: http://www.gstatic.com/generate_204
  interval: 180
rules:
- DOMAIN-KEYWORD,gavangtvttbdf,proxy test
- DOMAIN,androidtvlauncherxfe-pa.googleapis.com,google tv
- DOMAIN,www.walaoke.com,proxy test
- DOMAIN,savefrom.net,proxy test
- DOMAIN,vi.savefrom.net,proxy test
- DOMAIN,archive1.mozilla.org,REJECT
- DOMAIN,download.mozilla.org,REJECT
- DOMAIN,update.mozilla.org,REJECT
- DOMAIN,aus5.mozilla.org,REJECT
- DOMAIN-KEYWORD,bcp24,proxy test
- DOMAIN-KEYWORD,reddit1,proxy test
- DOMAIN-SUFFIX,googlevideo.com,proxy ytb
- DOMAIN-KEYWORD,youtube,proxy ytb
- DOMAIN-KEYWORD,makeuseof,proxy test
- DOMAIN-KEYWORD,xda,proxy test
- DOMAIN-KEYWORD,xvideos,proxy test
- DOMAIN-KEYWORD,pornhub,proxy test
- DOMAIN-KEYWORD,gsmarena,proxy test
- MATCH,DIRECT
