allow-lan: true
external-controller: 0.0.0.0:9090
log-level: info
mixed-port: 7890
mode: rule
dns:
  enable: true
  listen: 0.0.0.0:53          # lắng nghe DNS trên mọi interface
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"
    #- "192.168.31.1"
    # thêm domain nội bộ nếu có
  nameserver:
    - tls://dns.nextdns.io
#bravia--4k--vh21-c68936.dns.nextdns.io
    #- 8.8.8.8
    #- 1.1.1.1
  #fallback:
    #- tls://1.1.1.1
    #- tls://8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: VN            # hoặc VN tùy nhu cầu
proxy-providers:
  proxy-test:
    type: http
    #path: ./test.yaml
    #url: https://raw.githubusercontent.com/SnapdragonLee/SystemProxy/master/dist/clash_config_extra.yaml
    url: https://cdn.jsdelivr.net/gh/SnapdragonLee/SystemProxy@master/dist/clash_config_extra.yaml
    #filter: "(?i)HK"
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 1000    
  proxy-test2:
    type: http
    #path: ./test1.yaml
    url: https://cdn.jsdelivr.net/gh/f9nhcha/Ytb-ad-block@main/clash1.yaml
    filter: "(?i)gb"
    exclude-filter: "(?i)0.0|2.051|56.039|29.493|0.47|59.541|25.431|58.459|57.329|2.009|57.486|53.55|29.664|23.081|55.25|55.408|57.961|58.621"  
    interval: 900
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
  proxy-test1:
    type: http
    #path: ./test1.yaml
    url: https://cdn.jsdelivr.net/gh/SnapdragonLee/SystemProxy@master/dist/clash_config_extra.yaml
    filter: "(?i)gb_" 
    exclude-filter: "(?i)gb_26|gb_30|gb_31|gb_32|gb_33|gb_34|gb_35|gb_37|gb_38|gb_39|gb_40|gb_41|gb_43|gb_46|gb_47|gb_48|gb_50|gb_51|gb_57|gb_58|gb_60|gb_61|gb_62|gb_65|gb_67|gb_68|gb_70|gb_74|gb_75|gb_76"  
    interval: 910
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
  - name: "proxy test"
    type: select
    use:
     -  proxy-test
  - name: "proxy ytb"
    type: url-test
    use:
      - proxy-test1
    url: 'http://www.gstatic.com/generate_204'
    interval: 450
    #proxies:                # thêm DIRECT ở đây
      #- DIRECT
  - name: proxy ytb1
    type: url-test
    use:
     -  proxy-test2    
    url: 'http://www.gstatic.com/generate_204'
    interval: 180
rules:
  - 'DOMAIN,androidtvlauncherxfe-pa.googleapis.com,REJECT'
  - 'DOMAIN,www.walaoke.com,proxy test'
  - 'DOMAIN,savefrom.net,proxy test'
  - 'DOMAIN,vi.savefrom.net,proxy test'
  - 'DOMAIN,archive1.mozilla.org,REJECT'
  - 'DOMAIN,download.mozilla.org,REJECT'
  - 'DOMAIN,update.mozilla.org,REJECT'
  - 'DOMAIN,aus5.mozilla.org,REJECT'
  - 'DOMAIN-KEYWORD,bcp24,proxy test'
  - 'DOMAIN-KEYWORD,reddit1,proxy test'
  - 'DOMAIN-SUFFIX,googlevideo.com,proxy ytb1'
  - 'DOMAIN-KEYWORD,youtube,proxy ytb1' 
  - 'DOMAIN-KEYWORD,makeuseof,proxy test'
  - 'DOMAIN-KEYWORD,xda,proxy test'
  - 'DOMAIN-KEYWORD,xvideos,proxy test'
  - 'DOMAIN-KEYWORD,pornhub,proxy test'
  - 'DOMAIN-KEYWORD,gsmarena,proxy test'
  - 'MATCH,DIRECT'

