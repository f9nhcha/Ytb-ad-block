allow-lan: true
external-controller: 0.0.0.0:9090
log-level: info
mixed-port: 7890
mode: rule
dns:
  enable: true
  listen: 0.0.0.0:53          # lắng nghe DNS trên mọi interface
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"
    #- "192.168.31.1"
    # thêm domain nội bộ nếu có
  nameserver:
    - tls://dns.nextdns.io
#bravia--4k--vh21-c68936.dns.nextdns.io
    #- 8.8.8.8
    #- 1.1.1.1
  #fallback:
    #- tls://1.1.1.1
    #- tls://8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: VN            # hoặc VN tùy nhu cầu
proxy-providers:
  proxy-test:
    type: http
    #path: ./test.yaml
    #url: https://raw.githubusercontent.com/SnapdragonLee/SystemProxy/master/dist/clash_config_extra.yaml
    url: https://cdn.jsdelivr.net/gh/SnapdragonLee/SystemProxy@master/dist/clash_config_extra.yaml
    #filter: "(?i)HK"
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 1000    
  proxy-test2:
    type: http
    #path: ./test1.yaml
    url: https://cdn.jsdelivr.net/gh/f9nhcha/Ytb-ad-block@main/clash1.yaml
    filter: "(?i)GB-146.70.61.37-0059|NL-193.29.139.147-0086|GB-82.38.31.202-0097|GB-82.38.31.194-0089|GB-82.38.31.10-0080|GB-82.38.31.210-0064|GB-82.38.31.149-0085|GB-82.38.31.155-0067|GB-82.38.31.16-0096|GB-82.38.31.176-0141|GB-82.38.31.179-0105"
    #exclude-filter: "(?i)"  
    interval: 900
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
  proxy-test1:
    type: http
    #path: ./test1.yaml
    url: https://cdn.jsdelivr.net/gh/SnapdragonLee/SystemProxy@master/dist/clash_config_extra.yaml
    filter: "(?i)🇬🇧GB_49_0@48|🇬🇧GB_51_0@50|🇬🇧GB_12_0@11🇬🇧GB_22_0@21|🇧🇬BG_02_1@1|🇬🇧GB_09_0@8|🇬🇧GB_10_0@9|🇬🇧GB_11_0@10🇬🇧GB_12_0@11🇬🇧GB_13_0@12|🇬🇧GB_15_0@14|🇬🇧GB_17_0@16|🇬🇧GB_18_0@17|🇬🇧GB_19_0@18|🇬🇧GB_20_0@19|🇬🇧GB_21_0@20|🇬🇧GB_22_0@21" 
    #exclude-filter: "(?i)"  
    interval: 910
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
  - name: "proxy test"
    type: select
    use:
     -  proxy-test
  - name: "proxy ytb"
    type: url-test
    use:
      - proxy-test1
      - proxy-test2
    url: 'http://www.gstatic.com/generate_204'
    interval: 450
    #proxies:                # thêm DIRECT ở đây
      #- DIRECT
  - name: proxy ytb1
    type: select
    use:
     - proxy-test2
     #- proxy-test1    
    url: 'http://www.gstatic.com/generate_204'
    interval: 180
rules:
  - 'DOMAIN,androidtvlauncherxfe-pa.googleapis.com,REJECT'
  - 'DOMAIN,www.walaoke.com,proxy test'
  - 'DOMAIN,savefrom.net,proxy test'
  - 'DOMAIN,vi.savefrom.net,proxy test'
  - 'DOMAIN,archive1.mozilla.org,REJECT'
  - 'DOMAIN,download.mozilla.org,REJECT'
  - 'DOMAIN,update.mozilla.org,REJECT'
  - 'DOMAIN,aus5.mozilla.org,REJECT'
  - 'DOMAIN-KEYWORD,bcp24,proxy test'
  - 'DOMAIN-KEYWORD,reddit1,proxy test'
  - 'DOMAIN-SUFFIX,googlevideo.com,proxy ytb'
  - 'DOMAIN-KEYWORD,youtube,proxy ytb' 
  - 'DOMAIN-KEYWORD,makeuseof,proxy test'
  - 'DOMAIN-KEYWORD,xda,proxy test'
  - 'DOMAIN-KEYWORD,xvideos,proxy test'
  - 'DOMAIN-KEYWORD,pornhub,proxy test'
  - 'DOMAIN-KEYWORD,gsmarena,proxy test'
  - 'MATCH,DIRECT'

